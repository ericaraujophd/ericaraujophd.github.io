project:
  type: website
  output-dir: _site
  render:
    - "**/*.md"
    - "!footer.md"
    - "!_build/**"
    - "!_site/**"
    - "!.venv/**"
    - "!.quarto/**"
  resources:
    - cfr.html
    - "files/**"
    - "images/**"
    - "cv/**"
    - "style/**"

website:
  title: "Eric Araújo"
  favicon: files/Calvin_College.png
  description: "Eric Araújo's personal website — Associate Professor of Computer Science at Calvin University"

  navbar:
    logo: files/Calvin_College.png
    logo-alt: "Calvin University crest"
    title: "Eric Araújo"
    background: light
    right:
      - text: "✝️ CFR Generator"
        href: cfr.html
        target: _blank
      - text: "📅 Schedule"
        href: "https://outlook.office365.com/owa/calendar/c0bd07a3f1d64aaf9a74c91921ce7536@calvin.edu/79189cd730424803bceba861959c7e752179000899390454025/calendar.html"
        target: _blank

  sidebar:
    style: "docked"
    search: false
    collapse-level: 1
    contents:
      - href: index.md
        text: "Home"
      - href: teaching.md
        text: "Teaching"
      - section: "Publications"
        href: publications.md
        contents:
          - href: publications/2025-2029.md
            text: "2025–2029"
          - href: publications/2020-2024.md
            text: "2020–2024"
          - href: publications/2015-2019.md
            text: "2015–2019"
          - href: publications/2000-2014.md
            text: "2000–2014"
      - href: presentations.md
        text: "Presentations"
      - section: "Advising"
        href: advising.md
        contents:
          - href: advising/current.md
            text: "Current Students"
          - href: advising/past.md
            text: "Past Students"
      - href: updates.md
        text: "News & Updates"

format:
  html:
    theme: cosmo
    css: custom.css
    toc: false
    include-after-body: _footer.html
