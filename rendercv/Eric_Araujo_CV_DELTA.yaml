  sections:
    Summary:
    - I am a computer scientist at Calvin University who studies how opinions, emotions and behaviors
      spread through communities, using agent-based models. I am committed to helping Christians think
      well about artificial intelligence and the people it forms, in the classroom, at conferences and
      in the church. I led the AI & STEM track of Calvin's Wisdom in the Age of AI conference, will be
      part of Calvin's new Center for Faith and Technology, and am completing a Master of Divinity at
      Calvin Theological Seminary. I co-edit *Revisiting AI Ethics* (Springer, 2027).
