    grants_and_fellowships:
    - name: Templeton World Charity Foundation — Planning Grant
      url: https://www.templetonworldcharity.org/
      institution: Templeton World Charity Foundation, in partnership with the Nagel
        Institute for the Study of World Christianity
      summary: Planning grant for a research program on polarization and listening
        across communities, co-led with Dr. Damaris Parsitau. Extends the Bridging
        Beliefs and Behaviours modeling work to congregations in Brazil and Kenya,
        with ethnographic fieldwork preceding the computational modeling.
      date: June 2026 – Jan 2027
