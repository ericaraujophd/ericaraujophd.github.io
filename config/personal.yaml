welcome:
  - I investigate the spread of opinions, sentiments, and behaviors in complex systems
    through multiagent modeling and simulations, offering insights into social dynamics
    in politics, cooperation, health, criminology, and religion.
  - The work I develop is multidisciplinary, using agent-based models and data science
    to solve problems in areas such as political polarization in churches, public security,
    the spread of fake news, and promoting healthier lifestyles.

